{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Savat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <a class="logo" href="products.html">Food<span>Delivery</span></a>
    <nav class="nav">
        <a href="products.html">Mahsulotlar</a>
        <a href="orders.html">Buyurtmalar</a>
    </nav>
</header>
<main class="container">
    <div class="page-title">
        <div>
            <h1>🛒 Savat</h1>
            <p>OrderItemlar shu yerda boshqariladi</p>
        </div>
    </div>
    <section class="card">
        <div class="cart-item">
            <div class="cart-product">
                <div class="small-image">🍔</div>
                <div>
                    <h3>Classic Burger</h3>
                    <p class="muted">25 000 so'm</p>
                </div>
            </div>
            <div class="quantity">
                <button>−</button>
                <span>2</span>
                <button>+</button>
            </div>
            <strong>50 000 so'm</strong>
            <button class="danger btn">🗑</button>
        </div>
        <div class="cart-item">
            <div class="cart-product">
                <div class="small-image">🍕</div>
                <div>
                    <h3>Pepperoni Pizza</h3>
                    <p class="muted">55 000 so'm</p>
                </div>
            </div>
            <div class="quantity">
                <button>−</button>
                <span>1</span>
                <button>+</button>
            </div>
            <strong>55 000 so'm</strong>
            <button class="danger btn">🗑</button>
        </div>
        <div class="total">
            <span>Jami:</span>
            <strong>105 000 so'm</strong>
        </div>
        <div class="actions">
            <a class="btn secondary" href="products.html">
                ← Mahsulot qo'shish
            </a>
            <a class="btn primary" href="create-order.html">
                Buyurtma berish →
            </a>
        </div>
    </section>
</main>
</body>
</html>
