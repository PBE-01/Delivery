{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Order yaratish</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <a class="logo" href="products.html">Food<span>Delivery</span></a>
    <nav class="nav">
        <a href="products.html">Mahsulotlar</a>
        <a href="orders.html">Buyurtmalar</a>
    </nav>
</header>
<main class="container">
    <div class="page-title">
        <div>
            <h1>Buyurtmani tasdiqlash</h1>
            <p>Order va OrderItemlar tekshiriladi</p>
        </div>
    </div>
    <div class="checkout">
        <section class="card">
            <h2>Buyurtma elementlari</h2>
            <div class="summary-row">
                <span>Classic Burger × 2</span>
                <strong>50 000 so'm</strong>
            </div>
            <div class="summary-row">
                <span>Pepperoni Pizza × 1</span>
                <strong>55 000 so'm</strong>
            </div>
            <div class="total">
                <span>Jami:</span>
                <strong>105 000 so'm</strong>
            </div>
        </section>
        <section class="card">
            <h2>Foydalanuvchi</h2>
            <p style="margin:20px 0">
                👤 <strong>Jamshidbek</strong>
            </p>
            <form action="#" method="post">
                <button class="btn primary" type="submit">
                    ✓ Buyurtmani yaratish
                </button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
