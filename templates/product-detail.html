{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mahsulot</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="header">
    <a class="logo" href="{% url 'products:products' %}">Food<span>Delivery</span></a>
    <nav class="nav">
        <a href="{% url 'products:products' %}">Mahsulotlar</a>
        <a href="orders.html">Buyurtmalar</a>
        <a href="cart.html">🛒 Savat</a>
    </nav>
</header>
<main class="container">
    <a class="back" href="{% url 'products:products' %}">← Mahsulotlarga qaytish</a>
    <section class="card detail">
        <div class="detail-image">
            {% if product.img %}
                <img src="{{ product.img.url }}" alt="{{ product.name }}">
            {% else %}
                <img src="{% static 'css/no_image.jpg' %}" alt="No image">
            {% endif %}
        </div>
        <div>
            <span class="badge">{{ product.category.name }}</span>
            <h1>{{ product.name }}</h1>
            <p class="detail-description">{{ product.description }}</p>
            <div class="price" style="font-size:28px">{{ product.price }} so'm </div>
            <div class="quantity">
                <button>−</button>
                <span>1</span>
                <button>+</button>
            </div>
            <a class="btn primary" href="cart.html">🛒 Savatga qo'shish</a>
        </div>
    </section>
</main>
</body>
</html>
